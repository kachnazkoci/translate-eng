<!doctype html>
<html lang="cs">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Vocabulary Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>📚 Vocabulary Game</h1>
        <p>English ↔ Czech vocabulary trainer</p>
    </header>
    <main>
        <section class="card">
            <div class="filters"><label>Kniha<select id="book"></select></label><label>Část<select
                        id="part"></select></label><label>Kapitola / blok<select id="block"></select></label></div>
            <div class="bar"><button id="reset">Vymazat filtry</button><span id="count"></span></div>
        </section>
        <section class="card">
            <div class="tabs"><button class="tab active" data-mode="match">Párování</button><button class="tab"
                    data-mode="translate">Překlad</button></div>
            <div id="game"></div>
        </section>
    </main>
    <footer></footer>
    <script src="app.js"></script>
</body>

</html>
